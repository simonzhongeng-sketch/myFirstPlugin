name: release

# Build the plugin cdylib for each desktop platform and attach the binaries
# (plus plugin.toml) to a GitHub Release when a v* tag is pushed. Open CAD
# Studio's Plugin Manager reads the release assets, picks the one matching the
# user's OS/arch, and installs it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows plugin
        shell: powershell
        run: cargo build --release
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/*.dll dist/myFirstPlugin-windows-x86_64.dll
          cp plugin.toml dist/plugin.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/myFirstPlugin-windows-x86_64.dll
            dist/plugin.toml
